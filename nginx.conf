# Nginx Server Configuration Template for Foundation SPA
# Recommended placement: /etc/nginx/sites-available/foundation

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    # Root directory of the Foundation SPA (zero-build compatibility)
    root /var/www/foundation;
    index index.html;

    # SSL Certificate Settings (Template - Update paths to your actual SSL certificates)
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'none';" always;

    # Clean serving for llms.txt
    location = /llms.txt {
        default_type text/markdown;
        try_files /llms.txt =404;
    }

    # Clean rewrite for XML Sitemap
    location = /sitemap.xml {
        rewrite ^/sitemap\.xml$ /api/sitemap last;
    }

    # Clean rewrite for RSS Feed
    location = /rss.xml {
        rewrite ^/rss\.xml$ /api/rss last;
    }

    location = /feed {
        rewrite ^/feed$ /api/rss last;
    }

    # Proxy API Requests directly to Serverless Edge or local backend (e.g., Wrangler/Node backend)
    location /api/ {
        proxy_pass http://127.0.0.1:8787; # Update port or upstream as needed
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Assets Cache-Busting & Caching Rules
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|webp|woff|woff2|ttf|otf|json|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error Pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
