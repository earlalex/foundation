<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Foundation Navigation</title>
  <script>
    const l = window.location;
    // Handle GitHub Pages SPA subroute preservation without looping on Cloudflare or custom domains
    if (l.hostname.endsWith('github.io')) {
      const pathSegments = l.pathname.split('/').filter(Boolean);
      const repoName = pathSegments[0] || '';
      const targetRoute = '/' + pathSegments.slice(1).join('/');
      if (targetRoute && targetRoute !== '/') {
        sessionStorage.setItem('foundation_spa_route', targetRoute);
      }
      window.location.replace(l.origin + '/' + repoName + '/');
    } else {
      window.location.replace(l.origin + '/index.html');
    }
  </script>
</head>
<body>
  <p>Navigating to Foundation...</p>
</body>
</html>
