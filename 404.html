<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Foundation Navigation</title>
  <script>
    // GitHub Pages SPA Redirect Helper
    // Redirects subroute 404 requests back to repository index.html while preserving path
    const path = window.location.pathname;
    const repoName = path.split('/')[1] || '';
    const redirectUrl = '/' + repoName + '/index.html';
    window.location.replace(redirectUrl);
  </script>
</head>
<body>
  <p>Navigating to Foundation...</p>
</body>
</html>
