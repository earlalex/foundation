<section style="max-width: 800px; margin: 2rem auto; padding: 1rem;">
  <h1>⚙️ Foundation Admin Dashboard</h1>
  <p>Welcome back! You have full administrative privileges.</p>

  <div style="background: #f7fafc; border: 1px solid #e2e8f0; padding: 1.5rem; border-radius: 8px; margin-top: 1.5rem;">
    <h3>Quick Settings</h3>
    <button id="logout-btn" style="padding: 8px 16px; background: #e53e3e; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Sign Out
    </button>
  </div>
</section>

<script type="module">
  import { authManager } from '/core/auth.js';

  document.getElementById('logout-btn')?.addEventListener('click', async () => {
    await authManager.logout();
    window.router.navigateTo('/');
  });
</script>
